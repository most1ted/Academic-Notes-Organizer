
services:
  db:
    image: postgres
    environment:
      POSTGRES_DB : mydb
      POSTGRES_USER : user
      POSTGRES_PASSWORD : pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always
  web:
    build: .
    command : python  AcademicNotesOrganizer/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  postgres_data: