{% extends 'accounts/home.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-danger rounded-top-4 py-3">
                    <h4 class="mb-0">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Delete File
                    </h4>
                </div>
                <div class="card-body p-4">
                    <p class="mb-3">Are you sure you want to delete this file?</p>

                    <div class="alert alert-info rounded-pill d-flex align-items-center">
                        <i class="fas {{ file.get_file_icon }} fa-2x me-3"></i>
                        <div>
                            <strong>{{ file.original_filename }}</strong><br>
                            <span class="text-muted">{{ file.get_file_size_display }}</span>
                        </div>
                    </div>

                    <form method="post" class="mt-3">
                        {% csrf_token %}
                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-danger rounded-pill px-5 py-2 flex-grow-1">
                                <i class="fas fa-trash me-2"></i> Yes, Delete
                            </button>
                            <a href="{% url 'note_edit' file.note.id %}" class="btn btn-outline-secondary rounded-pill px-4 py-2">
                                <i class="fas fa-times me-2"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f8f9fa;
        color: #212529;
        line-height: 1.6;
    }
    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 15px;
    }
    .text-muted { color: #6c757d; }
    .text-white { color: #fff; }


    .mt-5 { margin-top: 3rem; }
    .mt-3 { margin-top: 1rem; }
    .mb-0 { margin-bottom: 0; }
    .mb-3 { margin-bottom: 1rem; }
    .p-4 { padding: 1.5rem; }
    .px-4 { padding-left: 1.5rem; padding-right: 1.5rem; }
    .px-5 { padding-left: 3rem; padding-right: 3rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-3 { padding-top: 1rem; padding-bottom: 1rem; }
    .me-2 { margin-right: 0.5rem; }
    .me-3 { margin-right: 1rem; }
    .fw-bold { font-weight: 700; }
    .border-0 { border: none; }
    .shadow-lg { box-shadow: 0 1rem 3rem rgba(0,0,0,0.175); }
    .rounded-4 { border-radius: 20px; }
    .rounded-top-4 {
        border-top-left-radius: 20px;
        border-top-right-radius: 20px;
    }
    .rounded-pill { border-radius: 50rem; }
    .flex-grow-1 { flex-grow: 1; }

    .d-flex { display: flex; }
    .align-items-center { align-items: center; }
    .justify-content-center { justify-content: center; }
    .gap-3 { gap: 1rem; }

    .row {
        display: flex;
        flex-wrap: wrap;
        margin: 0 -0.5rem;
    }
    .col-md-6 {
        width: 50%;
        padding: 0 0.5rem;
        margin: 0 auto;
    }


    .card {
        background: #fff;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid #f0f0f0;
        animation: fadeIn 0.5s ease-out;
    }
    .card-header {
        padding: 1rem 1.5rem;
        background: #dc3545;
    }
    .card-body { padding: 1.5rem; }

    .bg-danger {
        background: #dc3545;
    }


    .alert {
        padding: 0.75rem 1.25rem;
        border-radius: 50rem;
        border: 1px solid #dee2e6;
    }
    .alert-info {
        background: #d1ecf1;
        border-color: #bee5eb;
        color: #0c5460;
    }


    .btn {
        display: inline-block;
        font-weight: 600;
        text-align: center;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        line-height: 1.5;
        border-radius: 50rem;
        transition: all 0.3s ease;
        cursor: pointer;
        border: none;
        color: #fff;
        text-decoration: none;
    }
    .btn-danger {
        background: linear-gradient(135deg, #dc3545, #c82333);
        color: #fff;
    }
    .btn-danger:hover {
        background: linear-gradient(135deg, #c82333, #a71d2a);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .btn-outline-secondary {
        background: transparent;
        color: #6c757d;
        border: 2px solid #6c757d;
    }
    .btn-outline-secondary:hover {
        background: #6c757d;
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }


    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }


    @media (max-width: 768px) {
        .col-md-6 {
            width: 100%;
        }
        .d-flex.gap-3 {
            flex-direction: column;
        }
        .d-flex.gap-3 .btn {
            width: 100%;
        }
        .px-5 {
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }
        .alert.d-flex {
            flex-direction: column;
            text-align: center;
            gap: 8px;
        }
        .alert.d-flex .fa-2x {
            font-size: 2rem;
        }
    }

    @media (max-width: 576px) {
        .card-body {
            padding: 1rem;
        }
        .alert {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }
    }
</style>
{% endblock %}
